<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Книжная полка — личный каталог книг">
    <title>Книжная полка — каталог книг</title>
    
    <!-- СНАЧАЛА ШРИФТЫ -->
    <link rel="stylesheet" href="./fonts/fonts.css">
    
    <!-- ПОТОМ ГЛОБАЛЬНЫЕ СТИЛИ -->
    <link rel="stylesheet" href="./styles/global.css">
    
    <!-- ПОТОМ ЛОКАЛЬНЫЕ СТИЛИ -->
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <section class="hero">
        <div class="hero__content">
            <h1 class="hero__title">
                <span class="hero__title-line">КНИЖНАЯ</span>
                <span class="hero__title-line">ПОЛКА</span>
            </h1>
            <p class="hero__subtitle">ЧИТАЙ</p>
            <p class="hero__description">Твой личный каталог книг — открывай новые миры</p>
            <button class="hero__btn" id="goToCatalogBtn">ПЕРЕЙТИ К КАТАЛОГУ</button>
        </div>
        <div class="hero__bookshelf"></div>
    </section>

    <header class="header" id="header">
        <div class="header__logo">
            <!-- ЛОГОТИП ОБЁРНУТ В ССЫЛКУ (ОШИБКА 3 ИСПРАВЛЕНА) -->
            <a href="/" class="header__logo-link">
                <div class="header__logo-icon"></div>
                <span class="header__logo-text">КНИЖНАЯ ПОЛКА</span>
            </a>
        </div>
        <nav class="header__nav">
            <button class="nav__link active" data-page="catalog">КАТАЛОГ</button>
            <button class="nav__link" data-page="favorites">ИЗБРАННОЕ</button>
        </nav>
        <div class="header__favorites">
            <span id="favoriteCount">0</span>
        </div>
    </header>

    <main class="main-content">
        <section id="catalogPage" class="page active">
            <div class="catalog-header">
                <h2 class="catalog__title">Каталог книг</h2>
                <p class="catalog__count"><span id="booksCount">0</span> книг в коллекции</p>
            </div>

            <div class="filters">
                <div class="filters__search">
                    <input type="text" id="searchInput" placeholder="Поиск по названию или автору...">
                </div>
                <div class="filters__categories">
                    <button class="filter-btn active" data-genre="all">ВСЕ</button>
                    <button class="filter-btn" data-genre="Классика">КЛАССИКА</button>
                    <button class="filter-btn" data-genre="Антиутопия">АНТИТОПИЯ</button>
                    <button class="filter-btn" data-genre="Фэнтези">ФЭНТЕЗИ</button>
                    <button class="filter-btn" data-genre="Фантастика">ФАНТАСТИКА</button>
                    <button class="filter-btn" data-genre="Детектив">ДЕТЕКТИВ</button>
                    <button class="filter-btn" data-genre="Философия">ФИЛОСОФИЯ</button>
                </div>
                <div class="filters__sort">
                    <select id="sortSelect">
                        <option value="title">По названию</option>
                        <option value="author">По автору</option>
                        <option value="year">По году</option>
                        <option value="rating">По рейтингу</option>
                    </select>
                </div>
            </div>

            <div class="catalog-grid" id="catalogGrid"></div>
        </section>

        <section id="favoritesPage" class="page">
            <div class="catalog-header">
                <h2 class="catalog__title">Избранное</h2>
                <p class="catalog__count">Ваши любимые книги</p>
            </div>
            <div class="catalog-grid" id="favoritesGrid"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__content">
            <div class="footer__logo">
                <span class="footer__logo-icon">📚</span>
                <span>КНИЖНАЯ ПОЛКА</span>
            </div>
            <p class="footer__copy">© 2024 Книжная полка. Все права защищены.</p>
            <address class="footer__contacts">
                <a href="tel:+74951234567" class="footer__phone">+7 (495) 123-45-67</a>
                <a href="mailto:club@bookclub.ru" class="footer__email">club@bookclub.ru</a>
            </address>
        </div>
    </footer>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">✕</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
